<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Yaragon">
  <!--
    Yaragon mark - "the middle".
    Two endpoints route their traffic through a central node before it continues:
    a man-in-the-middle junction that also reads as the letter Y. No shields,
    locks, masks, or circuits. Linework inherits currentColor so the mark works
    on any background; the centre node carries the single brand accent.
  -->
  <g stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 15 L32 33"/>
    <path d="M49 15 L32 33"/>
    <path d="M32 33 L32 51"/>
  </g>
  <g fill="currentColor">
    <circle cx="15" cy="15" r="4.5"/>
    <circle cx="49" cy="15" r="4.5"/>
    <circle cx="32" cy="51" r="4.5"/>
  </g>
  <!-- the middle node: Yaragon, sitting between the endpoints -->
  <circle cx="32" cy="33" r="8" fill="#E0A34E"/>
</svg>
